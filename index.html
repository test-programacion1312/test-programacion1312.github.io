<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contáctanos</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="script.js"></script>
</head>
<body>
    <div class="form-container">
        <h2>Contáctanos</h2>
        <form id="contact-form">
            <label>Nombre</label>
            <input type="text" id="name" name="name" required>

            <label>Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label>Asunto</label>
            <input type="text" id="title" name="title" required>

            <label>Mensaje</label>
            <textarea id="message" rows="5" name="message" required></textarea>

            <div class="g-recaptcha" data-sitekey="6LdUaQIuAAAAACFGgEJlHvyJd3m4BniXphvvm_yz"></div>

            <button type="submit" id="button">Enviar</button>
        </form>
    </div>

    <!-- Cargar el SDK de EmailJS -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="text/javascript">
    // 1. Inicializar EmailJS con tu Public Key
    emailjs.init('vIVCGnBskUpFy5bDA'); // Reemplaza esto con tu Public Key real

    const btn = document.getElementById('button');
    const form = document.getElementById('contact-form');

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        btn.textContent = 'Enviando...';

        // 2. Enviar el formulario usando el Service ID y Template ID
        emailjs.sendForm('service_og8ydyr', 'template_4680q9f', this)
            .then(() => {
                btn.textContent = 'Enviar Mensaje';
                alert('¡Mensaje enviado con éxito!');
                form.reset();
            }, (err) => {
                btn.textContent = 'Enviar Mensaje';
                alert('Ocurrió un error al enviar el mensaje: ' + JSON.stringify(err));
            });
    });
</script>
</body>
</html>
