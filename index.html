<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contáctanos</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="script.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>
    <script type="text/javascript"> emailjs.init('vIVCGnBskUpFy5bDA')</script>
</head>
<body>
    
    <div class="form-container">
        <h2>Contáctanos</h2>
        <form id="formContacto">
            <label id="name">Nombre</label>
            <input type="text" id="name" name="name" required>

            <label id="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label id="title">Asunto</label>
            <input type="text" id="title" name="title" required>

            <label id="message">Mensaje</label>
            <textarea id="message" rows="5" name="message" required></textarea>

            <div class="g-recaptcha" data-sitekey="6LdUaQIuAAAAACFGgEJlHvyJd3m4BniXphvvm_yz"></div>

            <button type="submit" id="button">Enviar</button>
        </form>
    </div>
</body>
</html>
